name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 测试与静态检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 编译检查（语法）
        run: python -m compileall -q app

      - name: 运行约束回归测试
        env:
          LLM_API_KEY: EMPTY          # 测试不依赖真实模型
        run: pytest tests/ -v --tb=short

      - name: 校验评测用例结构
        run: |
          python - <<'PY'
          import json, sys
          cases = json.load(open("tests/eval_cases.json", encoding="utf-8"))
          assert len(cases) >= 30, f"评测用例应不少于 30 条，实际 {len(cases)}"
          need = {"id","question","expected_tools","expected_behavior","category"}
          for c in cases:
              missing = need - c.keys()
              assert not missing, f"{c.get('id')} 缺少字段 {missing}"
          print(f"OK: {len(cases)} 条用例校验通过")
          PY

  docker:
    name: 镜像构建验证
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像
        run: docker build -t clinic-triage-agent:ci .
