# 本地/测试环境一键起服务
# 用法：cp .env.example .env && 填好 LLM_API_KEY && docker compose up -d
services:
  clinic-agent:
    build: .
    image: clinic-triage-agent:latest
    container_name: clinic-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # 数据持久化：数据库、制度文档、索引
      - ./data:/srv/app/data
      - ./clinic.db:/srv/app/clinic.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
